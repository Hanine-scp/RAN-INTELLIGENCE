name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall src api scripts
      - name: Backend smoke import
        run: python -c "from api.main import app; print('backend_ok')"
      - name: Backend tests
        run: python -m pytest tests/backend -q

      - name: Daily ingest script compiles
        run: python -m compileall scripts/daily_ingest.py

      - name: Docker API image build
        run: docker build -f Dockerfile.api -t ran-intelligence-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Frontend unit tests
        run: |
          cd ../tests/frontend
          npm ci
          npm test
      - name: Build frontend
        run: npm run build
