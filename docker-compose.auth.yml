services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: ran-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ran_auth
      POSTGRES_PASSWORD: ran_auth_dev
      POSTGRES_DB: ran_intelligence
    ports:
      - "5433:5432"
    volumes:
      - ran_auth_pgdata:/var/lib/postgresql/data
      - ./scripts/sql/auth_schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ran_auth -d ran_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ran-auth-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ooredoo.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ran_auth_pgadmin:/var/lib/pgadmin
    depends_on:
      postgres-auth:
        condition: service_healthy

volumes:
  ran_auth_pgdata:
  ran_auth_pgadmin:
