services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ran-intelligence-api
    environment:
      - DATA_ROOT=/app/data/lake
      - DATA_XML_ROOT=/app/DATA.XML
    volumes:
      - C:/projects/DATA.XML:/app/DATA.XML:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ran-intelligence-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
